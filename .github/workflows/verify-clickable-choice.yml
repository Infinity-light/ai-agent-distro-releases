name: Verify Zhiduoduo Clickable Choice Production
run-name: "verify clickable-choice ${{ inputs.source_sha }} [deploy-run-${{ inputs.release_run_id }}]"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Deployed immutable source SHA
        required: true
      release_run_id:
        description: Bound successful production deployment run ID
        required: true

permissions:
  contents: read

concurrency:
  group: zhiduoduo-clickable-choice-production-uat
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate bound release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/Infinity-light/ai-agent-distro-releases/actions/runs/$RELEASE_RUN_ID")
          RUN="$run" node -e '
            const run = JSON.parse(process.env.RUN);
            if (run.status !== "completed" || run.conclusion !== "success") throw new Error("Bound deployment is not successful");
            if (!String(run.display_title || run.name).includes(process.env.SOURCE_SHA)) throw new Error("Deployment is not bound to SOURCE_SHA");
          '

      - name: Checkout immutable production UAT harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Infinity-light/ai-agent-distro
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.GH_RELEASE_REPO_TOKEN }}
          path: source

      - name: Install production browser acceptance runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p runtime
          npm install --prefix runtime --no-package-lock --no-save playwright@1.55.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" ./runtime/node_modules/.bin/playwright install --with-deps chromium

      - name: Create isolated activated UAT session
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -Eeuo pipefail
          E2E_UAT_PHONE="choice-uat-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "E2E_UAT_PHONE=$E2E_UAT_PHONE" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 700 "$HOME/.ssh"
          if [ "$SERVER_PORT" = "22" ]; then KNOWN_HOST="$SERVER_HOST"; else KNOWN_HOST="[$SERVER_HOST]:$SERVER_PORT"; fi
          printf '%s %s\n' "$KNOWN_HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPozXPwB/2d1z/Rw8ysubUWKlOZJYqXUqmIP8BeCrq4j' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          uat_json=$(sshpass -p "$SERVER_PASSWORD" ssh \
            -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" \
            "EXPECTED_RELEASE='$SOURCE_SHA' E2E_UAT_PHONE='$E2E_UAT_PHONE' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          APP_ROOT=/opt/apps/zhiduoduo-platform
          ACTIVE_RELEASE=$(readlink -f "$APP_ROOT/current")
          test "$(basename "$ACTIVE_RELEASE")" = "$EXPECTED_RELEASE"
          cd "$ACTIVE_RELEASE"
          node --env-file="$APP_ROOT/shared/.env" <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const jwt = require('jsonwebtoken');
          const prisma = new PrismaClient();
          const scopedPrefix = 'choice-uat-';
          async function removeScopedUatUsers() {
            const users = await prisma.user.findMany({
              where: { phone: { startsWith: scopedPrefix } },
              select: { id: true, phone: true },
            });
            if (users.length > 20) throw new Error('Refusing to remove more than 20 scoped UAT users');
            if (users.some((user) => !user.phone.startsWith(scopedPrefix))) throw new Error('UAT cleanup escaped its phone prefix');
            const userIds = users.map((user) => user.id);
            if (!userIds.length) return 0;
            await prisma.$transaction([
              prisma.businessProfile.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.creditReservation.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.tokenUsageLog.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.dailyTokenUsage.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.aiChatAction.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.aiChatRequest.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.aiConversation.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.aiGeneration.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.tokenPack.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.feedback.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.user.deleteMany({ where: { id: { in: userIds }, phone: { startsWith: scopedPrefix } } }),
            ]);
            return users.length;
          }
          (async () => {
            const removed = await removeScopedUatUsers();
            if (removed) console.error(`Removed ${removed} stale scoped clickable-choice UAT user(s)`);
            const user = await prisma.user.create({
              data: {
                phone: process.env.E2E_UAT_PHONE,
                email: process.env.E2E_UAT_PHONE + '@test.local',
                passwordHash: 'disabled-production-clickable-choice-uat',
                name: '可点击选择生产验收',
                role: 'TERMINAL_USER',
                isActivated: true,
                aiPersona: 'PRODUCT_OWNER',
                aiOnboardingDone: true,
                aiProfileData: {
                  industry: '餐饮',
                  productType: '本地餐饮门店',
                  targetAudience: '本地到店消费者',
                },
                tokenPacks: {
                  create: {
                    name: '生产 UAT 临时积分',
                    totalTokens: 100000,
                    price: 0,
                    expiresAt: new Date(Date.now() + 60 * 60 * 1000),
                  },
                },
              },
            });
            const token = jwt.sign(
              { sub: user.id, phone: user.phone, role: user.role, sessionVersion: user.sessionVersion },
              process.env.JWT_SECRET,
              { expiresIn: '45m' },
            );
            console.log(JSON.stringify({ userId: user.id, token }));
          })().finally(() => prisma.$disconnect());
          NODE
          REMOTE
          )
          E2E_USER_ID=$(UAT_JSON="$uat_json" node -e 'process.stdout.write(JSON.parse(process.env.UAT_JSON).userId)')
          E2E_TOKEN=$(UAT_JSON="$uat_json" node -e 'process.stdout.write(JSON.parse(process.env.UAT_JSON).token)')
          echo "::add-mask::$E2E_TOKEN"
          echo "E2E_USER_ID=$E2E_USER_ID" >> "$GITHUB_ENV"
          echo "E2E_TOKEN=$E2E_TOKEN" >> "$GITHUB_ENV"

      - name: Run real production clickable-choice UAT
        env:
          E2E_BASE_URL: https://zhiduoduoai.com
          EXPECTED_RELEASE: ${{ inputs.source_sha }}
          E2E_EVIDENCE_DIR: uat-artifacts
          NODE_PATH: ${{ github.workspace }}/runtime/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: node source/.github/e2e/production-clickable-choice.cjs

      - name: Upload production UAT evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clickable-choice-production-uat-${{ inputs.source_sha }}
          path: uat-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Remove isolated UAT user
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -Eeuo pipefail
          if [ -z "${E2E_UAT_PHONE:-}" ]; then
            echo 'No UAT identity was allocated; cleanup is unnecessary.'
            exit 0
          fi
          sshpass -p "$SERVER_PASSWORD" ssh \
            -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" \
            "EXPECTED_RELEASE='$SOURCE_SHA' E2E_USER_ID='${E2E_USER_ID:-}' E2E_UAT_PHONE='$E2E_UAT_PHONE' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          APP_ROOT=/opt/apps/zhiduoduo-platform
          ACTIVE_RELEASE=$(readlink -f "$APP_ROOT/current")
          test "$(basename "$ACTIVE_RELEASE")" = "$EXPECTED_RELEASE"
          cd "$ACTIVE_RELEASE"
          node --env-file="$APP_ROOT/shared/.env" <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          const scopedPrefix = 'choice-uat-';
          (async () => {
            const users = await prisma.user.findMany({
              where: { phone: { startsWith: scopedPrefix } },
              select: { id: true, phone: true },
            });
            if (users.length > 20) throw new Error('Refusing to remove more than 20 scoped UAT users');
            if (users.some((user) => !user.phone.startsWith(scopedPrefix))) throw new Error('UAT cleanup escaped its phone prefix');
            const userIds = users.map((user) => user.id);
            if (!userIds.length) return;
            await prisma.$transaction([
              prisma.businessProfile.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.creditReservation.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.tokenUsageLog.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.dailyTokenUsage.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.aiChatAction.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.aiChatRequest.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.aiConversation.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.aiGeneration.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.tokenPack.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.feedback.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.user.deleteMany({ where: { id: { in: userIds }, phone: { startsWith: scopedPrefix } } }),
            ]);
            console.log(JSON.stringify({ removedScopedUatUsers: users.length }));
          })().finally(() => prisma.$disconnect());
          NODE
          REMOTE

      - name: Record production clickable-choice acceptance
        run: |
          echo 'production_clickable_choice_uat=passed'
          echo 'release_run_id=${{ inputs.release_run_id }}'
          echo 'source_sha=${{ inputs.source_sha }}'
