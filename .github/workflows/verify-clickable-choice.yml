name: Verify Zhiduoduo Clickable Choice Production
run-name: "verify clickable-choice ${{ inputs.source_sha }} [deploy-run-${{ inputs.release_run_id }} harness-${{ inputs.harness_sha }}]"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Deployed immutable source SHA
        required: true
      release_run_id:
        description: Bound successful production deployment run ID
        required: true
      harness_sha:
        description: Immutable source SHA containing the UAT assertions
        required: true

permissions:
  contents: read

concurrency:
  group: zhiduoduo-clickable-choice-production-uat
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate bound release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          HARNESS_SHA: ${{ inputs.harness_sha }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HARNESS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/Infinity-light/ai-agent-distro-releases/actions/runs/$RELEASE_RUN_ID")
          RUN="$run" node -e '
            const run = JSON.parse(process.env.RUN);
            if (run.status !== "completed" || run.conclusion !== "success") throw new Error("Bound deployment is not successful");
            if (!String(run.display_title || run.name).includes(process.env.SOURCE_SHA)) throw new Error("Deployment is not bound to SOURCE_SHA");
          '

      - name: Checkout immutable production UAT harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Infinity-light/ai-agent-distro
          ref: ${{ inputs.harness_sha }}
          token: ${{ secrets.GH_RELEASE_REPO_TOKEN }}
          path: source

      - name: Install production browser acceptance runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-package-lock --no-save @playwright/test@1.55.1
          test -x ./node_modules/.bin/playwright
          (
            cd source/.github/e2e
            node -e "const resolved=require.resolve('@playwright/test'); if (!resolved) throw new Error('Playwright test runtime is unresolved')"
          )
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" ./node_modules/.bin/playwright install --with-deps chromium

      - name: Create isolated activated UAT session
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -Eeuo pipefail
          E2E_UAT_PHONE="choice-uat-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "E2E_UAT_PHONE=$E2E_UAT_PHONE" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 700 "$HOME/.ssh"
          if [ "$SERVER_PORT" = "22" ]; then KNOWN_HOST="$SERVER_HOST"; else KNOWN_HOST="[$SERVER_HOST]:$SERVER_PORT"; fi
          printf '%s %s\n' "$KNOWN_HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPozXPwB/2d1z/Rw8ysubUWKlOZJYqXUqmIP8BeCrq4j' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          REMOTE_AUTH="/tmp/zdd-choice-privacy-auth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.cjs"
          trap 'sshpass -p "$SERVER_PASSWORD" ssh -p "$SERVER_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$SERVER_USER@$SERVER_HOST" "rm -f -- '\''$REMOTE_AUTH'\''" >/dev/null 2>&1 || true' EXIT
          umask 077
          E2E_SESSION_FILE="$RUNNER_TEMP/clickable-choice-session.json"
          E2E_TOKEN_FILE="$RUNNER_TEMP/clickable-choice-token"
          E2E_EXISTING_SESSION_FILE="$RUNNER_TEMP/clickable-choice-existing-session.json"
          E2E_INTERNAL_AUDIT_FILE="$RUNNER_TEMP/clickable-choice-internal-audit.json"
          echo "E2E_SESSION_FILE=$E2E_SESSION_FILE" >> "$GITHUB_ENV"
          echo "E2E_TOKEN_FILE=$E2E_TOKEN_FILE" >> "$GITHUB_ENV"
          echo "E2E_EXISTING_SESSION_FILE=$E2E_EXISTING_SESSION_FILE" >> "$GITHUB_ENV"
          echo "E2E_INTERNAL_AUDIT_FILE=$E2E_INTERNAL_AUDIT_FILE" >> "$GITHUB_ENV"
          sshpass -p "$SERVER_PASSWORD" ssh \
            -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" \
            "EXPECTED_RELEASE='$SOURCE_SHA' E2E_UAT_PHONE='$E2E_UAT_PHONE' bash -se" > "$E2E_SESSION_FILE" <<'REMOTE'
          set -Eeuo pipefail
          APP_ROOT=/opt/apps/zhiduoduo-platform
          ACTIVE_RELEASE=$(readlink -f "$APP_ROOT/current")
          test "$(basename "$ACTIVE_RELEASE")" = "$EXPECTED_RELEASE"
          cd "$ACTIVE_RELEASE"
          node --env-file="$APP_ROOT/shared/.env" <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const bcrypt = require('bcryptjs');
          const crypto = require('node:crypto');
          const prisma = new PrismaClient();
          const scopedPrefix = 'choice-uat-';
          async function removeScopedUatUsers() {
            const users = await prisma.user.findMany({
              where: { phone: { startsWith: scopedPrefix } },
              select: { id: true, phone: true },
            });
            if (users.length > 20) throw new Error('Refusing to remove more than 20 scoped UAT users');
            if (users.some((user) => !user.phone.startsWith(scopedPrefix))) throw new Error('UAT cleanup escaped its phone prefix');
            const userIds = users.map((user) => user.id);
            if (!userIds.length) return 0;
            await prisma.$transaction([
              prisma.businessProfile.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.creditReservation.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.tokenUsageLog.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.dailyTokenUsage.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.aiChatAction.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.aiChatRequest.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.aiConversation.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.aiGeneration.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.tokenPack.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.feedback.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.user.deleteMany({ where: { id: { in: userIds }, phone: { startsWith: scopedPrefix } } }),
            ]);
            return users.length;
          }
          (async () => {
            const removed = await removeScopedUatUsers();
            if (removed) console.error(`Removed ${removed} stale scoped clickable-choice UAT user(s)`);
            const password = crypto.randomBytes(24).toString('base64url');
            const passwordHash = await bcrypt.hash(password, 12);
            const user = await prisma.user.create({
              data: {
                phone: process.env.E2E_UAT_PHONE,
                email: process.env.E2E_UAT_PHONE + '@test.local',
                passwordHash,
                name: '可点击选择生产验收',
                role: 'TERMINAL_USER',
                isActivated: true,
                aiPersona: 'PRODUCT_OWNER',
                aiOnboardingDone: true,
                aiProfileData: {
                  industry: '餐饮',
                  productType: '本地餐饮门店',
                  targetAudience: '本地到店消费者',
                },
                tokenPacks: {
                  create: {
                    name: '生产 UAT 临时积分',
                    totalTokens: 100000,
                    price: 0,
                    expiresAt: new Date(Date.now() + 60 * 60 * 1000),
                  },
                },
              },
            });
            console.log(JSON.stringify({ userId: user.id, phone: user.phone, password }));
          })().finally(() => prisma.$disconnect());
          NODE
          REMOTE
          chmod 600 "$E2E_SESSION_FILE"
          SESSION_FILE="$E2E_SESSION_FILE" TOKEN_FILE="$E2E_TOKEN_FILE" node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const session = JSON.parse(fs.readFileSync(process.env.SESSION_FILE, 'utf8'));
            if (!session.userId || !session.phone || !session.password) throw new Error('Synthetic login handoff is incomplete');
            const response = await fetch('https://zhiduoduoai.com/api/auth/login', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ phone: session.phone, password: session.password }),
            });
            const payload = await response.json();
            const login = payload?.data ?? payload;
            if (!response.ok || !login?.access_token) throw new Error(`Synthetic login returned HTTP ${response.status}`);
            fs.writeFileSync(process.env.TOKEN_FILE, login.access_token, { mode: 0o600 });
            fs.chmodSync(process.env.TOKEN_FILE, 0o600);
          })();
          NODE
          E2E_USER_ID=$(SESSION_FILE="$E2E_SESSION_FILE" node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(process.env.SESSION_FILE,'utf8')).userId)")
          echo "E2E_USER_ID=$E2E_USER_ID" >> "$GITHUB_ENV"

          test -f source/.workflow/verification/zdd-flat-chat-events/latest-admin-readonly-auth.cjs
          sshpass -p "$SERVER_PASSWORD" scp \
            -P "$SERVER_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            source/.workflow/verification/zdd-flat-chat-events/latest-admin-readonly-auth.cjs \
            "$SERVER_USER@$SERVER_HOST:$REMOTE_AUTH"
          sshpass -p "$SERVER_PASSWORD" ssh \
            -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" \
            "APP_ROOT=/opt/apps/zhiduoduo-platform; ACTIVE_RELEASE=\$(readlink -f \"\$APP_ROOT/current\"); test \"\$(basename \"\$ACTIVE_RELEASE\")\" = '$SOURCE_SHA'; cd \"\$ACTIVE_RELEASE\"; NODE_PATH=\"\$ACTIVE_RELEASE/node_modules\" EXPECTED_RELEASE='$SOURCE_SHA' node --env-file=\"\$APP_ROOT/shared/.env\" '$REMOTE_AUTH'" \
            > "$E2E_EXISTING_SESSION_FILE"
          chmod 600 "$E2E_EXISTING_SESSION_FILE"

          sshpass -p "$SERVER_PASSWORD" ssh \
            -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" \
            "EXPECTED_RELEASE='$SOURCE_SHA' bash -se" > "$E2E_INTERNAL_AUDIT_FILE" <<'REMOTE'
          set -Eeuo pipefail
          APP_ROOT=/opt/apps/zhiduoduo-platform
          ACTIVE_RELEASE=$(readlink -f "$APP_ROOT/current")
          test "$(basename "$ACTIVE_RELEASE")" = "$EXPECTED_RELEASE"
          cd "$ACTIVE_RELEASE"
          node --env-file="$APP_ROOT/shared/.env" <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          const sourceMessageId = '09dfbd28-dd73-43f5-847d-29de2a8a83e3';
          const sourceEventId = 'b319d457-c2c7-4e04-8d8a-8efaf33d72ce:tool:call_13016461813a4677ace75ea2';
          (async () => {
            const source = await prisma.aiMessage.findUnique({
              where: { id: sourceMessageId },
              select: {
                id: true,
                conversationId: true,
                conversation: {
                  select: {
                    user: { select: { id: true, isActive: true, isActivated: true } },
                    messages: { select: { role: true, attachments: true } },
                  },
                },
              },
            });
            if (!source) throw new Error('Bound source message is missing');
            const receipts = source.conversation.messages.flatMap((message) => (
              message.role === 'user' && Array.isArray(message.attachments)
                ? message.attachments.filter((attachment) => attachment?.type === 'choice_input'
                  && attachment.sourceMessageId === sourceMessageId)
                : []
            ));
            if (receipts.length !== 1) throw new Error(`Expected one trusted receipt, found ${receipts.length}`);
            if (receipts[0].sourceEventId !== sourceEventId) throw new Error('Trusted receipt source event drifted');
            const user = source.conversation.user;
            if (!user.isActive || !user.isActivated) throw new Error('Bound conversation owner is not eligible for user-surface UAT');
            console.log(JSON.stringify({
              userId: user.id,
              conversationId: source.conversationId,
              internalAudit: { receiptCount: receipts.length, sourceMessageBound: true, sourceEventBound: true },
            }));
          })().finally(() => prisma.$disconnect());
          NODE
          REMOTE
          chmod 600 "$E2E_INTERNAL_AUDIT_FILE"

      - name: Verify protected handoff and trusted receipt boundary
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -Eeuo pipefail
          test "$(stat -c '%a' "$E2E_TOKEN_FILE")" = '600'
          test "$(stat -c '%a' "$E2E_SESSION_FILE")" = '600'
          test "$(stat -c '%a' "$E2E_EXISTING_SESSION_FILE")" = '600'
          test "$(stat -c '%a' "$E2E_INTERNAL_AUDIT_FILE")" = '600'
          mkdir -p uat-artifacts
          EXISTING_SESSION_FILE="$E2E_EXISTING_SESSION_FILE" \
          INTERNAL_AUDIT_FILE="$E2E_INTERNAL_AUDIT_FILE" \
          SYNTHETIC_TOKEN_FILE="$E2E_TOKEN_FILE" \
          SYNTHETIC_SESSION_FILE="$E2E_SESSION_FILE" node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const binding = JSON.parse(fs.readFileSync(process.env.EXISTING_SESSION_FILE, 'utf8'));
          const audit = JSON.parse(fs.readFileSync(process.env.INTERNAL_AUDIT_FILE, 'utf8'));
          const syntheticToken = fs.readFileSync(process.env.SYNTHETIC_TOKEN_FILE, 'utf8').trim();
          const synthetic = JSON.parse(fs.readFileSync(process.env.SYNTHETIC_SESSION_FILE, 'utf8'));
          if (!binding.readOnly || binding.release !== process.env.SOURCE_SHA
            || !binding.token || !binding.userId || !binding.conversationId) {
            throw new Error('Existing read-only session binding is incomplete');
          }
          if (binding.userId !== audit.userId) {
            throw new Error('Latest administrator session owner does not match the exact audited conversation owner');
          }
          if (audit.internalAudit?.receiptCount !== 1
            || audit.internalAudit?.sourceMessageBound !== true
            || audit.internalAudit?.sourceEventBound !== true) {
            throw new Error('Trusted internal receipt audit failed');
          }
          const ref = (value) => crypto.createHash('sha256').update(String(value)).digest('hex').slice(0, 16);
          const get = async (token, path) => {
            const response = await fetch(`https://zhiduoduoai.com${path}`, {
              headers: { authorization: `Bearer ${token}` },
            });
            return { response, body: await response.text() };
          };
          (async () => {
            const ownerMe = await get(binding.token, '/api/auth/me');
            if (!ownerMe.response.ok) throw new Error(`Owner /auth/me returned HTTP ${ownerMe.response.status}`);
            const ownerPayload = JSON.parse(ownerMe.body);
            const owner = ownerPayload?.data ?? ownerPayload;
            if (owner.id !== binding.userId) throw new Error('Owner /auth/me identity does not match the bounded session');

            binding.conversationId = audit.conversationId;
            fs.writeFileSync(process.env.EXISTING_SESSION_FILE, JSON.stringify(binding), { mode: 0o600 });
            fs.chmodSync(process.env.EXISTING_SESSION_FILE, 0o600);

            const syntheticMe = await get(syntheticToken, '/api/auth/me');
            if (!syntheticMe.response.ok) throw new Error(`Synthetic /auth/me returned HTTP ${syntheticMe.response.status}`);
            const syntheticPayload = JSON.parse(syntheticMe.body);
            const syntheticUser = syntheticPayload?.data ?? syntheticPayload;
            if (syntheticUser.id !== synthetic.userId) throw new Error('Synthetic /auth/me identity does not match the test account');

            const denied = await get(
              syntheticToken,
              `/api/ai/chat/conversations/${encodeURIComponent(audit.conversationId)}`,
            );
            if (![400, 403, 404].includes(denied.response.status)) {
              throw new Error(`Cross-account exact-conversation read returned HTTP ${denied.response.status}`);
            }
            for (const forbidden of [
              '09dfbd28-dd73-43f5-847d-29de2a8a83e3',
              'choice_input', 'choice-input', 'sourceEventId', 'sourceChoiceId', 'sourceMessageId',
            ]) {
              if (denied.body.includes(forbidden)) throw new Error('Cross-account denial disclosed internal conversation facts');
            }

            fs.writeFileSync('uat-artifacts/trusted-internal-choice-audit.json', `${JSON.stringify({
              status: 'passed',
              conversationRef: ref(binding.conversationId),
              receiptCount: 1,
              sourceMessageBound: true,
              sourceEventBound: true,
              mutations: 'none',
              publicCredentialFields: 0,
            }, null, 2)}\n`);
            fs.writeFileSync('uat-artifacts/auth-boundary-preflight.json', `${JSON.stringify({
              status: 'passed',
              ownerAuthMeStatus: ownerMe.response.status,
              ownerRef: ref(binding.userId),
              syntheticAuthMeStatus: syntheticMe.response.status,
              syntheticRef: ref(synthetic.userId),
              crossAccountExactConversationStatus: denied.response.status,
              crossAccountProtocolHits: 0,
            }, null, 2)}\n`);
          })();
          NODE

      - name: Run real production clickable-choice UAT
        env:
          E2E_BASE_URL: https://zhiduoduoai.com
          EXPECTED_RELEASE: ${{ inputs.source_sha }}
          E2E_EVIDENCE_DIR: uat-artifacts
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: node source/.github/e2e/production-clickable-choice.cjs

      - name: Remove isolated UAT user
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -Eeuo pipefail
          if [ -z "${E2E_UAT_PHONE:-}" ]; then
            mkdir -p uat-artifacts
            printf '%s\n' '{"removedScopedUatUsers":0,"residualScopedUatUsers":0}' > uat-artifacts/cleanup.json
            exit 0
          fi
          mkdir -p uat-artifacts
          sshpass -p "$SERVER_PASSWORD" ssh \
            -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" \
            "EXPECTED_RELEASE='$SOURCE_SHA' E2E_USER_ID='${E2E_USER_ID:-}' E2E_UAT_PHONE='$E2E_UAT_PHONE' bash -se" > uat-artifacts/cleanup.json <<'REMOTE'
          set -Eeuo pipefail
          APP_ROOT=/opt/apps/zhiduoduo-platform
          ACTIVE_RELEASE=$(readlink -f "$APP_ROOT/current")
          test "$(basename "$ACTIVE_RELEASE")" = "$EXPECTED_RELEASE"
          cd "$ACTIVE_RELEASE"
          node --env-file="$APP_ROOT/shared/.env" <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          const scopedPrefix = 'choice-uat-';
          (async () => {
            const users = await prisma.user.findMany({
              where: { phone: { startsWith: scopedPrefix } },
              select: { id: true, phone: true },
            });
            if (users.length > 20) throw new Error('Refusing to remove more than 20 scoped UAT users');
            if (users.some((user) => !user.phone.startsWith(scopedPrefix))) throw new Error('UAT cleanup escaped its phone prefix');
            const userIds = users.map((user) => user.id);
            if (!userIds.length) {
              console.log(JSON.stringify({ removedScopedUatUsers: 0, residualScopedUatUsers: 0 }));
              return;
            }
            await prisma.$transaction([
              prisma.businessProfile.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.creditReservation.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.tokenUsageLog.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.dailyTokenUsage.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.aiChatAction.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.aiChatRequest.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.aiConversation.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.aiGeneration.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.tokenPack.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.feedback.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.user.deleteMany({ where: { id: { in: userIds }, phone: { startsWith: scopedPrefix } } }),
            ]);
            const residual = await prisma.user.count({ where: { phone: { startsWith: scopedPrefix } } });
            if (residual !== 0) throw new Error(`Scoped clickable-choice UAT users remain: ${residual}`);
            console.log(JSON.stringify({ removedScopedUatUsers: users.length, residualScopedUatUsers: residual }));
          })().finally(() => prisma.$disconnect());
          NODE
          REMOTE

      - name: Destroy protected session handoff
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          for protected_file in \
            "${E2E_TOKEN_FILE:-}" \
            "${E2E_EXISTING_SESSION_FILE:-}" \
            "${E2E_INTERNAL_AUDIT_FILE:-}" \
            "${E2E_SESSION_FILE:-}"; do
            if [ -n "$protected_file" ]; then
              rm -f -- "$protected_file"
              test ! -e "$protected_file"
            fi
          done

      - name: Enforce evidence credential privacy
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d uat-artifacts
          if grep -RIE --binary-files=without-match \
            '(eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|JWT_SECRET|DATABASE_URL|postgres(ql)?://|access[_-]?token|authorization[[:space:]]*:[[:space:]]*bearer|"password"[[:space:]]*:)' \
            uat-artifacts; then
            echo 'Credential-like material found in UAT evidence' >&2
            exit 1
          fi

      - name: Upload production UAT evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clickable-choice-production-uat-${{ inputs.source_sha }}
          path: uat-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Record production clickable-choice acceptance
        run: |
          echo 'production_clickable_choice_uat=passed'
          echo 'release_run_id=${{ inputs.release_run_id }}'
          echo 'source_sha=${{ inputs.source_sha }}'
