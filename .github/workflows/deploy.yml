name: Deploy Zhiduoduo Production
run-name: "deploy ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source_sha || inputs.ref }} [${{ github.event_name == 'repository_dispatch' && github.event.client_payload.dispatch_id || 'manual' }}]"

on:
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:
    inputs:
      ref:
        description: Immutable source commit SHA
        required: true
      repo:
        description: Source repository
        required: true
        default: Infinity-light/ai-agent-distro

permissions:
  contents: read

concurrency:
  group: zhiduoduo-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve and bind immutable source
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
          DISPATCH_REPO: ${{ github.event.client_payload.repo }}
          DISPATCH_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          EVENT_DISPATCH_ID: ${{ github.event.client_payload.dispatch_id }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_REPO: ${{ inputs.repo }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            REF="$DISPATCH_REF"
            REPO="$DISPATCH_REPO"
            SOURCE_SHA="$DISPATCH_SOURCE_SHA"
            DISPATCH_ID="$EVENT_DISPATCH_ID"
          else
            REF="$INPUT_REF"
            REPO="$INPUT_REPO"
            SOURCE_SHA="$INPUT_REF"
            DISPATCH_ID="manual-$RUN_ID"
          fi
          test "$REPO" = "Infinity-light/ai-agent-distro"
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]]
          test "$REF" = "$SOURCE_SHA"
          [[ "$DISPATCH_ID" =~ ^[A-Za-z0-9._:-]{1,128}$ ]]
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "dispatch_id=$DISPATCH_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout private source at bound SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ steps.source.outputs.repo }}
          ref: ${{ steps.source.outputs.ref }}
          token: ${{ secrets.GH_RELEASE_REPO_TOKEN }}

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.30.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install, audit, test, and build release
        env:
          # The workflow runs in the public proxy repository, so GITHUB_SHA is
          # the proxy revision rather than the immutable application release.
          # Bind Vite/PWA metadata to the resolved private source SHA.
          VITE_RELEASE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level=moderate --registry=https://registry.npmjs.org
          pnpm exec prisma generate
          pnpm test
          pnpm build
          pnpm --filter @zhiduoduo/storefront exec tsc --noEmit
          pnpm --filter @zhiduoduo/storefront build
          node -e '
            const fs = require("node:fs");
            const version = JSON.parse(fs.readFileSync("apps/storefront/dist/version.json", "utf8"));
            if (version.releaseId !== process.env.VITE_RELEASE_SHA) {
              throw new Error(`Storefront release ${version.releaseId} is not bound to ${process.env.VITE_RELEASE_SHA}`);
            }
          '
          pnpm --filter @zhiduoduo/admin exec tsc --noEmit
          pnpm --filter @zhiduoduo/admin build

      - name: Package immutable release and deployment script
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/deploy.legacy-disabled.yml.off').read_text(encoding='utf-8')
          marker = '          script: |\n'
          if marker not in source:
              raise SystemExit('deployment script marker missing')
          block = source.split(marker, 1)[1]
          lines = []
          for line in block.splitlines():
              if line and not line.startswith('            '):
                  raise SystemExit(f'unexpected deployment script indentation: {line[:80]}')
              lines.append(line[12:] if line else '')
          script = '\n'.join(lines) + '\n'
          required_delivery_contract = [
              "VERIFICATION_PROVIDER: 'disabled'",
              "VERIFICATION_SMS_PROVIDER: 'disabled'",
              "VERIFICATION_EMAIL_PROVIDER: 'directmail'",
              "MAIL_PROVIDER: 'directmail'",
              'DM_ACCESS_KEY_ID: dmSource.values.DM_ACCESS_KEY_ID',
              'DM_ACCESS_KEY_SECRET: dmSource.values.DM_ACCESS_KEY_SECRET',
              'LEGACY_ENV_FILE="${OLD_RELEASE:+$OLD_RELEASE/.env}"',
              "execFileSync('pm2', ['jlist']",
              'DirectMail managed source presence:',
              'No complete protected DirectMail configuration source is available',
              'unset DM_ACCESS_KEY_ID DM_ACCESS_KEY_SECRET DM_ACCOUNT_NAME DM_ENDPOINT DM_SENDER_ALIAS',
              'Production SMS verification must remain disabled',
              'Missing production DirectMail configuration',
          ]
          missing = [item for item in required_delivery_contract if item not in script]
          if missing:
              raise SystemExit(f'production verification delivery contract missing: {missing}')
          Path('production-deploy.sh').write_text(script, encoding='utf-8', newline='\n')
          PY
          bash -n production-deploy.sh
          tar -czf deploy.tar.gz \
            dist/ \
            apps/storefront/dist/ \
            apps/storefront/package.json \
            apps/admin/dist/ \
            apps/admin/package.json \
            prisma/ \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            nest-cli.json \
            tsconfig.json \
            ecosystem.config.js \
            nginx/ \
            .env.example

      - name: Copy release to production server
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          if [ "$SERVER_PORT" = "22" ]; then
            KNOWN_HOST="$SERVER_HOST"
          else
            KNOWN_HOST="[$SERVER_HOST]:$SERVER_PORT"
          fi
          printf '%s %s\n' "$KNOWN_HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPozXPwB/2d1z/Rw8ysubUWKlOZJYqXUqmIP8BeCrq4j' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ASKPASS_SCRIPT="$RUNNER_TEMP/zhiduoduo-deploy-askpass"
          trap 'rm -f -- "$ASKPASS_SCRIPT"' EXIT
          printf '%s\n' '#!/usr/bin/env sh' 'printf "%s\\n" "$SERVER_PASSWORD"' > "$ASKPASS_SCRIPT"
          chmod 700 "$ASKPASS_SCRIPT"
          export SSH_ASKPASS="$ASKPASS_SCRIPT"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=zhiduoduo-deploy:0
          timeout 180s setsid --wait scp \
            -P "$SERVER_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o NumberOfPasswordPrompts=1 \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            deploy.tar.gz \
            "$SERVER_USER@$SERVER_HOST:/opt/apps/zhiduoduo-platform/deploy.tar.gz" </dev/null

      - name: Deploy release with database backup, health, and stability acceptance
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_ID: ${{ steps.source.outputs.source_sha }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GPT_IMAGE_BASE_URL: ${{ secrets.GPT_IMAGE_BASE_URL }}
          GPT_IMAGE_API_KEY: ${{ secrets.GPT_IMAGE_API_KEY }}
          MODEL_PROVIDER_JKSPEED_API_KEY: ${{ secrets.MODEL_PROVIDER_JKSPEED_API_KEY }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          # Optional protected injection. When these secrets are not configured,
          # production-deploy.sh preserves the existing mode-0600 server values.
          DM_ACCESS_KEY_ID: ${{ secrets.DM_ACCESS_KEY_ID }}
          DM_ACCESS_KEY_SECRET: ${{ secrets.DM_ACCESS_KEY_SECRET }}
          DM_ACCOUNT_NAME: ${{ secrets.DM_ACCOUNT_NAME }}
          DM_ENDPOINT: ${{ secrets.DM_ENDPOINT }}
          DM_SENDER_ALIAS: ${{ secrets.DM_SENDER_ALIAS }}
          VOLCENGINE_ASR_API_KEY: ${{ secrets.VOLCENGINE_ASR_API_KEY }}
          MODEL_PROVIDER_MINIMAX_API_KEY: ${{ secrets.MODEL_PROVIDER_MINIMAX_API_KEY }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_MCH_ID: ${{ secrets.WECHAT_MCH_ID }}
          WECHAT_API_V3_KEY: ${{ secrets.WECHAT_API_V3_KEY }}
          WECHAT_MCH_SERIAL_NO: ${{ secrets.WECHAT_MCH_SERIAL_NO }}
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
          WECHAT_PUBLIC_KEY: ${{ secrets.WECHAT_PUBLIC_KEY }}
          WECHAT_PUBLIC_KEY_ID: ${{ secrets.WECHAT_PUBLIC_KEY_ID }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          # drone-ssh negotiates the server ECDSA host key; SCP above pins ED25519.
          fingerprint: SHA256:gy2tS+Z/+PjfElXqJ4oRRuVSpIeo8CfWyKOcXqB3FSI
          command_timeout: 25m
          envs: RELEASE_ID,DEEPSEEK_API_KEY,GPT_IMAGE_BASE_URL,GPT_IMAGE_API_KEY,MODEL_PROVIDER_JKSPEED_API_KEY,OSS_REGION,OSS_ACCESS_KEY_ID,OSS_ACCESS_KEY_SECRET,OSS_BUCKET,ARK_API_KEY,DM_ACCESS_KEY_ID,DM_ACCESS_KEY_SECRET,DM_ACCOUNT_NAME,DM_ENDPOINT,DM_SENDER_ALIAS,VOLCENGINE_ASR_API_KEY,MODEL_PROVIDER_MINIMAX_API_KEY,WECHAT_APP_ID,WECHAT_MCH_ID,WECHAT_API_V3_KEY,WECHAT_MCH_SERIAL_NO,WECHAT_PRIVATE_KEY,WECHAT_PUBLIC_KEY,WECHAT_PUBLIC_KEY_ID
          script_path: production-deploy.sh

      - name: Record bound release acceptance
        run: |
          echo "Accepted source_sha=${{ steps.source.outputs.source_sha }}"
          echo "dispatch_id=${{ steps.source.outputs.dispatch_id }}"
