name: Verify Zhiduoduo Unified Resource Protocol Production
run-name: "verify unified-resource ${{ inputs.source_sha }} [deploy-run-${{ inputs.release_run_id }}]"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Deployed immutable source SHA containing the UAT harness
        required: true
      release_run_id:
        description: Bound successful production deployment run ID
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: zhiduoduo-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Validate bound production release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/Infinity-light/ai-agent-distro-releases/actions/runs/$RELEASE_RUN_ID")
          RUN="$run" node -e '
            const run = JSON.parse(process.env.RUN);
            if (run.status !== "completed" || run.conclusion !== "success") throw new Error("Bound deployment is not successful");
            if (!String(run.display_title || run.name).includes(process.env.SOURCE_SHA)) throw new Error("Deployment is not bound to SOURCE_SHA");
          '

      - name: Checkout exact production source and UAT harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Infinity-light/ai-agent-distro
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.GH_RELEASE_REPO_TOKEN }}
          path: source

      - name: Install browser and protected SSH runtime
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -Eeuo pipefail
          mkdir -p runtime
          npm install --prefix runtime --no-package-lock --no-save playwright@1.55.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" ./runtime/node_modules/.bin/playwright install --with-deps chromium
          install -d -m 700 "$HOME/.ssh"
          if [ "$SERVER_PORT" = "22" ]; then KNOWN_HOST="$SERVER_HOST"; else KNOWN_HOST="[$SERVER_HOST]:$SERVER_PORT"; fi
          printf '%s %s\n' "$KNOWN_HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPozXPwB/2d1z/Rw8ysubUWKlOZJYqXUqmIP8BeCrq4j' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ASKPASS_SCRIPT="$RUNNER_TEMP/zhiduoduo-resource-uat-askpass"
          SSH_WRAPPER="$RUNNER_TEMP/zhiduoduo-resource-uat-ssh"
          printf '%s\n' '#!/usr/bin/env sh' 'printf "%s\n" "$SERVER_PASSWORD"' > "$ASKPASS_SCRIPT"
          cat > "$SSH_WRAPPER" <<'SSH_WRAPPER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          exec timeout 900s setsid --wait ssh \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o NumberOfPasswordPrompts=1 \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            "$@"
          SSH_WRAPPER
          chmod 700 "$ASKPASS_SCRIPT" "$SSH_WRAPPER"
          {
            echo "SSH_ASKPASS=$ASKPASS_SCRIPT"
            echo "SSH_ASKPASS_REQUIRE=force"
            echo "DISPLAY=zhiduoduo-resource-uat:0"
            echo "E2E_SSH_WRAPPER=$SSH_WRAPPER"
          } >> "$GITHUB_ENV"

      - name: Create isolated resources with protected credential handoff
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -Eeuo pipefail
          mkdir -p uat-artifacts
          E2E_UAT_PREFIX="resource-protocol-uat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SERVER_CREDENTIAL_FILE="/tmp/zhiduoduo-resource-uat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          RUNNER_CREDENTIAL_FILE="$RUNNER_TEMP/zhiduoduo-resource-uat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          {
            echo "E2E_UAT_PREFIX=$E2E_UAT_PREFIX"
            echo "SERVER_CREDENTIAL_FILE=$SERVER_CREDENTIAL_FILE"
            echo "RUNNER_CREDENTIAL_FILE=$RUNNER_CREDENTIAL_FILE"
          } >> "$GITHUB_ENV"
          output=$("$E2E_SSH_WRAPPER" \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "APP_ROOT=/opt/apps/zhiduoduo-platform; ACTIVE_RELEASE=\$(readlink -f \"/opt/apps/zhiduoduo-platform/current\"); test \"\$(basename \"\$ACTIVE_RELEASE\")\" = '$SOURCE_SHA'; cd \"\$ACTIVE_RELEASE\"; EXPECTED_RELEASE='$SOURCE_SHA' E2E_UAT_PREFIX='$E2E_UAT_PREFIX' E2E_CREDENTIAL_FILE='$SERVER_CREDENTIAL_FILE' node --env-file=\"\$APP_ROOT/shared/.env\" -" \
            < source/.github/e2e/production-unified-resource-protocol-setup.cjs)
          setup=$(printf '%s\n' "$output" | tail -n 1)
          printf '%s\n' "$setup" | tee uat-artifacts/setup.json
          SETUP_JSON="$setup" node -e '
            const setup = JSON.parse(process.env.SETUP_JSON);
            if (setup.setup !== "passed" || setup.credentialTransport !== "protected-file-0600") throw new Error("Protected setup failed");
          '
          umask 077
          setsid --wait scp \
            -P "$SERVER_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=30 \
            -o NumberOfPasswordPrompts=1 \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            "$SERVER_USER@$SERVER_HOST:$SERVER_CREDENTIAL_FILE" \
            "$RUNNER_CREDENTIAL_FILE" </dev/null
          chmod 600 "$RUNNER_CREDENTIAL_FILE"
          test "$(stat -c '%a' "$RUNNER_CREDENTIAL_FILE")" = "600"

      - name: Run production desktop, 390px, PWA, auth, and compatibility UAT
        env:
          E2E_BASE_URL: https://zhiduoduoai.com
          EXPECTED_RELEASE: ${{ inputs.source_sha }}
          E2E_EVIDENCE_DIR: uat-artifacts
          NODE_PATH: ${{ github.workspace }}/runtime/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: E2E_CREDENTIAL_FILE="$RUNNER_CREDENTIAL_FILE" node source/.github/e2e/production-unified-resource-protocol.cjs

      - name: Collect private ledger invariants as redacted evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -Eeuo pipefail
          output=$("$E2E_SSH_WRAPPER" \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "APP_ROOT=/opt/apps/zhiduoduo-platform; ACTIVE_RELEASE=\$(readlink -f \"/opt/apps/zhiduoduo-platform/current\"); test \"\$(basename \"\$ACTIVE_RELEASE\")\" = '$SOURCE_SHA'; cd \"\$ACTIVE_RELEASE\"; EXPECTED_RELEASE='$SOURCE_SHA' E2E_UAT_PREFIX='$E2E_UAT_PREFIX' node --env-file=\"\$APP_ROOT/shared/.env\" -" \
            < source/.github/e2e/production-unified-resource-protocol-ledger.cjs)
          ledger=$(printf '%s\n' "$output" | tail -n 1)
          printf '%s\n' "$ledger" | tee uat-artifacts/server-ledger.json
          LEDGER_JSON="$ledger" node -e '
            const ledger = JSON.parse(process.env.LEDGER_JSON);
            if (!ledger.acceptance?.passed || ledger.billing?.nonTextUsageCount !== 0 || ledger.billing?.reservationCount !== 0) {
              throw new Error("Resource protocol ledger acceptance failed");
            }
          '

      - name: Remove scoped data and destroy server credential file
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -Eeuo pipefail
          mkdir -p uat-artifacts
          if [ -z "${E2E_UAT_PREFIX:-}" ]; then
            printf '%s\n' '{"cleanup":"not-required","reason":"scope-not-allocated","credentialDestroyed":true}' | tee uat-artifacts/cleanup.json
            exit 0
          fi
          output=$("$E2E_SSH_WRAPPER" \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "APP_ROOT=/opt/apps/zhiduoduo-platform; ACTIVE_RELEASE=\$(readlink -f \"/opt/apps/zhiduoduo-platform/current\"); test \"\$(basename \"\$ACTIVE_RELEASE\")\" = '$SOURCE_SHA'; cd \"\$ACTIVE_RELEASE\"; E2E_UAT_PREFIX='$E2E_UAT_PREFIX' E2E_CREDENTIAL_FILE='${SERVER_CREDENTIAL_FILE:-/tmp/zhiduoduo-resource-uat-none.json}' node --env-file=\"\$APP_ROOT/shared/.env\" -" \
            < source/.github/e2e/production-unified-resource-protocol-cleanup.cjs)
          cleanup=$(printf '%s\n' "$output" | tail -n 1)
          printf '%s\n' "$cleanup" | tee uat-artifacts/cleanup.json
          CLEANUP_JSON="$cleanup" node -e '
            const cleanup = JSON.parse(process.env.CLEANUP_JSON);
            if (cleanup.cleanup !== "passed" || !cleanup.credentialDestroyed || Object.values(cleanup.remaining || {}).some(Number)) {
              throw new Error("Scoped cleanup did not reach zero residual state");
            }
          '

      - name: Destroy runner credentials and enforce artifact privacy
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${RUNNER_CREDENTIAL_FILE:-}" ] && [ -f "$RUNNER_CREDENTIAL_FILE" ]; then
            size=$(stat -c '%s' "$RUNNER_CREDENTIAL_FILE")
            if [ "$size" -gt 0 ]; then dd if=/dev/zero of="$RUNNER_CREDENTIAL_FILE" bs="$size" count=1 conv=notrunc status=none; fi
            rm -f -- "$RUNNER_CREDENTIAL_FILE"
          fi
          test -z "${RUNNER_CREDENTIAL_FILE:-}" || test ! -e "$RUNNER_CREDENTIAL_FILE"
          python3 - <<'PY'
          import pathlib
          import re

          root = pathlib.Path('uat-artifacts')
          jwt = re.compile(rb'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}')
          connection = re.compile(rb'postgres(?:ql)?://[^:/\s]+:[^@/\s]+@', re.I)
          protected_keys = re.compile(rb'"(?:token|jwt|jwtSecret|authorization|databaseUrl|credential)"\s*:', re.I)
          for item in root.rglob('*'):
              if not item.is_file():
                  continue
              data = item.read_bytes()
              if jwt.search(data) or connection.search(data) or protected_keys.search(data):
                  raise SystemExit(f'protected credential material detected in {item.name}')
          print('artifact_privacy_gate=passed')
          PY

      - name: Upload redacted production UAT evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unified-resource-protocol-production-uat-${{ inputs.source_sha }}
          path: uat-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Record unified resource protocol acceptance
        if: success()
        run: |
          echo 'production_unified_resource_protocol_uat=passed'
          echo 'release_run_id=${{ inputs.release_run_id }}'
          echo 'source_sha=${{ inputs.source_sha }}'
          echo 'verification_url=https://zhiduoduoai.com/chat'
