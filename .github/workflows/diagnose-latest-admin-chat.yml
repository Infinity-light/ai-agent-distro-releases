name: Diagnose Latest Zhiduoduo Admin Chat
run-name: "diagnose latest admin chat ${{ inputs.source_sha }} [harness-${{ inputs.harness_sha }}]"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Active immutable production release SHA
        required: true
      harness_sha:
        description: Immutable private source SHA containing the read-only collector
        required: true

permissions:
  contents: read

concurrency:
  group: zhiduoduo-latest-admin-chat-readonly
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate immutable inputs
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          HARNESS_SHA: ${{ inputs.harness_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HARNESS_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout immutable private collector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Infinity-light/ai-agent-distro
          ref: ${{ inputs.harness_sha }}
          token: ${{ secrets.GH_RELEASE_REPO_TOKEN }}
          path: source

      - name: Collect bounded read-only chat evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -Eeuo pipefail
          mkdir -p diagnostic-artifacts
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 700 "$HOME/.ssh"
          if [ "$SERVER_PORT" = "22" ]; then KNOWN_HOST="$SERVER_HOST"; else KNOWN_HOST="[$SERVER_HOST]:$SERVER_PORT"; fi
          printf '%s %s\n' "$KNOWN_HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPozXPwB/2d1z/Rw8ysubUWKlOZJYqXUqmIP8BeCrq4j' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          REMOTE_COLLECTOR="/tmp/zdd-latest-admin-chat-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.cjs"
          trap 'sshpass -p "$SERVER_PASSWORD" ssh -p "$SERVER_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$SERVER_USER@$SERVER_HOST" "rm -f -- '\''$REMOTE_COLLECTOR'\''" >/dev/null 2>&1 || true' EXIT
          sshpass -p "$SERVER_PASSWORD" scp \
            -P "$SERVER_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            source/.workflow/verification/zdd-flat-chat-events/latest-admin-readonly.cjs \
            "$SERVER_USER@$SERVER_HOST:$REMOTE_COLLECTOR"
          sshpass -p "$SERVER_PASSWORD" ssh \
            -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" \
            "APP_ROOT=/opt/apps/zhiduoduo-platform; ACTIVE_RELEASE=\$(readlink -f \"\$APP_ROOT/current\"); test \"\$(basename \"\$ACTIVE_RELEASE\")\" = '$SOURCE_SHA'; cd \"\$ACTIVE_RELEASE\"; NODE_PATH=\"\$ACTIVE_RELEASE/node_modules\" EXPECTED_RELEASE='$SOURCE_SHA' SUMMARY_ONLY=1 node --env-file=\"\$APP_ROOT/shared/.env\" '$REMOTE_COLLECTOR'" \
            > diagnostic-artifacts/latest-admin-chat-readonly.json

      - name: Upload bounded read-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: latest-admin-chat-readonly-${{ inputs.source_sha }}
          path: diagnostic-artifacts/
          if-no-files-found: error
          retention-days: 1

      - name: Record read-only boundary
        run: |
          echo 'latest_admin_chat_diagnostic=completed'
          echo 'mutations=none'
          echo 'source_sha=${{ inputs.source_sha }}'
          echo 'harness_sha=${{ inputs.harness_sha }}'
