name: Verify Seedance Protocol Paid Production
run-name: "verify seedance-protocol-paid ${{ inputs.source_sha }} [deploy-run-${{ inputs.release_run_id }} harness-${{ inputs.harness_sha }}]"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Deployed immutable source SHA
        required: true
      release_run_id:
        description: Bound successful production deployment run ID
        required: true
      harness_sha:
        description: Same immutable source SHA containing the paid UAT assertions
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: zhiduoduo-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Validate immutable release and harness binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          HARNESS_SHA: ${{ inputs.harness_sha }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HARNESS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          test "$HARNESS_SHA" = "$SOURCE_SHA"
          run=$(gh api "repos/Infinity-light/ai-agent-distro-releases/actions/runs/$RELEASE_RUN_ID")
          RUN="$run" node -e '
            const run = JSON.parse(process.env.RUN);
            if (run.status !== "completed" || run.conclusion !== "success") throw new Error("Bound deployment is not successful");
            if (!String(run.display_title || run.name).includes(process.env.SOURCE_SHA)) throw new Error("Deployment is not bound to SOURCE_SHA");
          '

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout exact deployed source and paid assertions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Infinity-light/ai-agent-distro
          ref: ${{ inputs.harness_sha }}
          token: ${{ secrets.GH_RELEASE_REPO_TOKEN }}
          path: source

      - name: Install production browser and bounded SSH runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-package-lock --no-save playwright@1.55.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" npx playwright install --with-deps chromium
          ASKPASS_SCRIPT="$RUNNER_TEMP/seedance-protocol-paid-askpass"
          SSH_WRAPPER="$RUNNER_TEMP/seedance-protocol-paid-ssh"
          printf '%s\n' '#!/usr/bin/env sh' 'printf "%s\n" "$SERVER_PASSWORD"' > "$ASKPASS_SCRIPT"
          cat > "$SSH_WRAPPER" <<'SSH_WRAPPER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          exec timeout 900s setsid --wait ssh \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o NumberOfPasswordPrompts=1 \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            "$@"
          SSH_WRAPPER
          chmod 700 "$ASKPASS_SCRIPT" "$SSH_WRAPPER"
          {
            echo "SSH_ASKPASS=$ASKPASS_SCRIPT"
            echo "SSH_ASKPASS_REQUIRE=force"
            echo "DISPLAY=seedance-protocol-paid:0"
            echo "E2E_SSH_WRAPPER=$SSH_WRAPPER"
          } >> "$GITHUB_ENV"

      - name: Recheck price contract and create exact-cap isolated fixtures
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -Eeuo pipefail
          E2E_UAT_PREFIX="seedance-protocol-paid-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "E2E_UAT_PREFIX=$E2E_UAT_PREFIX" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          if [ "$SERVER_PORT" = "22" ]; then KNOWN_HOST="$SERVER_HOST"; else KNOWN_HOST="[$SERVER_HOST]:$SERVER_PORT"; fi
          printf '%s %s\n' "$KNOWN_HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPozXPwB/2d1z/Rw8ysubUWKlOZJYqXUqmIP8BeCrq4j' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          output=$("$E2E_SSH_WRAPPER" \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "APP_ROOT=/opt/apps/zhiduoduo-platform; ACTIVE_RELEASE=\$(readlink -f \"/opt/apps/zhiduoduo-platform/current\"); test \"\$(basename \"\$ACTIVE_RELEASE\")\" = '$SOURCE_SHA'; cd \"\$ACTIVE_RELEASE\"; EXPECTED_RELEASE='$SOURCE_SHA' E2E_UAT_PREFIX='$E2E_UAT_PREFIX' node --env-file=\"\$APP_ROOT/shared/.env\" -" \
            < source/.github/e2e/production-seedance-protocol-paid-setup.cjs)
          uat_json=$(printf '%s\n' "$output" | tail -n 1)
          E2E_USER_ID=$(UAT_JSON="$uat_json" node -e 'process.stdout.write(JSON.parse(process.env.UAT_JSON).userId)')
          E2E_USER_TOKEN=$(UAT_JSON="$uat_json" node -e 'process.stdout.write(JSON.parse(process.env.UAT_JSON).token)')
          E2E_MODEL_DEFINITION_ID=$(UAT_JSON="$uat_json" node -e 'process.stdout.write(JSON.parse(process.env.UAT_JSON).modelDefinitionId)')
          E2E_CONVERSATION_ID=$(UAT_JSON="$uat_json" node -e 'process.stdout.write(JSON.parse(process.env.UAT_JSON).conversationId)')
          E2E_PROJECT_ID=$(UAT_JSON="$uat_json" node -e 'process.stdout.write(JSON.parse(process.env.UAT_JSON).projectId)')
          E2E_PLAN_REVISION=$(UAT_JSON="$uat_json" node -e 'process.stdout.write(String(JSON.parse(process.env.UAT_JSON).planRevision))')
          E2E_ASSETS_JSON=$(UAT_JSON="$uat_json" node -e 'process.stdout.write(JSON.stringify(JSON.parse(process.env.UAT_JSON).assets))')
          for value in "$E2E_USER_ID" "$E2E_USER_TOKEN" "$E2E_CONVERSATION_ID" "$E2E_PROJECT_ID"; do echo "::add-mask::$value"; done
          UAT_JSON="$uat_json" node -e '
            for (const asset of JSON.parse(process.env.UAT_JSON).assets) {
              for (const value of [asset.materialId, asset.generationId, asset.url, asset.objectKey]) console.log(`::add-mask::${value}`);
            }
          '
          {
            echo "E2E_USER_ID=$E2E_USER_ID"
            echo "E2E_USER_TOKEN=$E2E_USER_TOKEN"
            echo "E2E_MODEL_DEFINITION_ID=$E2E_MODEL_DEFINITION_ID"
            echo "E2E_CONVERSATION_ID=$E2E_CONVERSATION_ID"
            echo "E2E_PROJECT_ID=$E2E_PROJECT_ID"
            echo "E2E_PLAN_REVISION=$E2E_PLAN_REVISION"
            echo 'E2E_ASSETS_JSON<<__SEEDANCE_ASSETS__'
            echo "$E2E_ASSETS_JSON"
            echo '__SEEDANCE_ASSETS__'
          } >> "$GITHUB_ENV"
          mkdir -p uat-artifacts
          UAT_JSON="$uat_json" SOURCE_SHA="$SOURCE_SHA" node -e '
            const value = JSON.parse(process.env.UAT_JSON);
            console.log(JSON.stringify({
              release: process.env.SOURCE_SHA,
              priceContractCheckedBeforeIdentity: true,
              model: value.providerModelId,
              pricingRuleKey: value.pricingRuleKey,
              authorizedVideoCredits: value.authorizedVideoCredits,
              chatControlCredits: value.chatControlCredits,
              atomicFixtureCount: value.assets.length,
              imageProviderCalls: 0,
              frozenByBusinessService: true,
              planRevision: value.planRevision,
              planVersion: value.planVersion,
              contractHash: value.contractHash,
              planModes: value.planModes,
            }, null, 2));
          ' > uat-artifacts/paid-protocol-preflight.json

      - name: Confirm through real UI and run exactly three four-second calls
        env:
          E2E_BASE_URL: https://zhiduoduoai.com
          EXPECTED_RELEASE: ${{ inputs.source_sha }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
          E2E_EVIDENCE_DIR: uat-artifacts
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: node source/.github/e2e/production-seedance-protocol-paid.cjs

      - name: Prove plan, Provider requests, tail lineage, QC, and actual billing
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -Eeuo pipefail
          mkdir -p uat-artifacts
          if [ -z "${E2E_PAID_PRODUCTION_ID:-}" ] || [ -z "${E2E_USER_ID:-}" ]; then
            printf '{"ledger":"skipped","reason":"paid browser UAT created no durable production"}\n' | tee uat-artifacts/paid-protocol-ledger.json
            exit 0
          fi
          output=$("$E2E_SSH_WRAPPER" \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "APP_ROOT=/opt/apps/zhiduoduo-platform; ACTIVE_RELEASE=\$(readlink -f \"/opt/apps/zhiduoduo-platform/current\"); test \"\$(basename \"\$ACTIVE_RELEASE\")\" = '$SOURCE_SHA'; cd \"\$ACTIVE_RELEASE\"; EXPECTED_RELEASE='$SOURCE_SHA' E2E_USER_ID='$E2E_USER_ID' E2E_PAID_PRODUCTION_ID='$E2E_PAID_PRODUCTION_ID' node --env-file=\"\$APP_ROOT/shared/.env\" -" \
            < source/.github/e2e/production-seedance-protocol-paid-ledger.cjs)
          printf '%s\n' "$output" | tail -n 1 | tee uat-artifacts/paid-protocol-ledger.json

      - name: Remove the isolated account, records, and OSS objects
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -Eeuo pipefail
          mkdir -p uat-artifacts
          if [ -z "${E2E_UAT_PREFIX:-}" ]; then
            printf '{"cleanup":"skipped","reason":"no paid UAT namespace allocated"}\n' | tee uat-artifacts/seedance-protocol-paid-cleanup.json
            exit 0
          fi
          output=$("$E2E_SSH_WRAPPER" \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "APP_ROOT=/opt/apps/zhiduoduo-platform; ACTIVE_RELEASE=\$(readlink -f \"/opt/apps/zhiduoduo-platform/current\"); test \"\$(basename \"\$ACTIVE_RELEASE\")\" = '$SOURCE_SHA'; cd \"\$ACTIVE_RELEASE\"; EXPECTED_RELEASE='$SOURCE_SHA' E2E_UAT_PREFIX='$E2E_UAT_PREFIX' node --env-file=\"\$APP_ROOT/shared/.env\" -" \
            < source/.github/e2e/production-seedance-protocol-paid-cleanup.cjs)
          printf '%s\n' "$output" | tail -n 1 | tee uat-artifacts/seedance-protocol-paid-cleanup.json

      - name: Upload bounded paid UAT evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seedance-protocol-paid-${{ inputs.source_sha }}
          path: uat-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Record paid protocol acceptance
        if: success()
        run: |
          echo 'seedance_protocol_paid_uat=passed'
          echo 'provider_generation_calls=3'
          echo 'seconds_per_call=4'
          echo 'authorized_credits=1200'
          echo 'source_sha=${{ inputs.source_sha }}'
          echo 'release_run_id=${{ inputs.release_run_id }}'
          echo 'verification_url=https://zhiduoduoai.com/video-production'
