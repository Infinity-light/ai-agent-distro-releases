name: Verify Zhiduoduo Points Calendar Ledger Production
run-name: "verify points-calendar-ledger ${{ inputs.source_sha }} [deploy-run-${{ inputs.release_run_id }}]"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Deployed immutable source SHA
        required: true
      release_run_id:
        description: Bound successful production deployment run ID
        required: true

permissions:
  contents: read

concurrency:
  group: zhiduoduo-points-calendar-ledger-production-uat
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate bound release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/Infinity-light/ai-agent-distro-releases/actions/runs/$RELEASE_RUN_ID")
          RUN="$run" node -e '
            const run = JSON.parse(process.env.RUN);
            if (run.status !== "completed" || run.conclusion !== "success") throw new Error("Bound deployment is not successful");
            if (!String(run.display_title || run.name).includes(process.env.SOURCE_SHA)) throw new Error("Deployment is not bound to SOURCE_SHA");
          '

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install production browser acceptance runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-package-lock --no-save playwright@1.55.0
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" npx playwright install --with-deps chromium

      - name: Allocate isolated user and seed sanitized ledger categories
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -Eeuo pipefail
          E2E_UAT_PHONE="points-calendar-uat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "E2E_UAT_PHONE=$E2E_UAT_PHONE" >> "$GITHUB_ENV"
          mkdir -p uat-artifacts
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 700 "$HOME/.ssh"
          if [ "$SERVER_PORT" = "22" ]; then KNOWN_HOST="$SERVER_HOST"; else KNOWN_HOST="[$SERVER_HOST]:$SERVER_PORT"; fi
          printf '%s %s\n' "$KNOWN_HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPozXPwB/2d1z/Rw8ysubUWKlOZJYqXUqmIP8BeCrq4j' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          uat_json=$(sshpass -p "$SERVER_PASSWORD" ssh \
            -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" \
            "EXPECTED_RELEASE='$SOURCE_SHA' E2E_UAT_PHONE='$E2E_UAT_PHONE' UAT_RUN_ID='$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          APP_ROOT=/opt/apps/zhiduoduo-platform
          ACTIVE_RELEASE=$(readlink -f "$APP_ROOT/current")
          test "$(basename "$ACTIVE_RELEASE")" = "$EXPECTED_RELEASE"
          cd "$ACTIVE_RELEASE"
          node --env-file="$APP_ROOT/shared/.env" <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const jwt = require('jsonwebtoken');

          const prisma = new PrismaClient();
          const apiBase = 'http://127.0.0.1:3100/api';
          const prefix = 'points-calendar-uat-';

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          function tokenFor(user) {
            return jwt.sign(
              { sub: user.id, phone: user.phone, role: user.role, sv: user.sessionVersion },
              process.env.JWT_SECRET,
              { expiresIn: '30m' },
            );
          }

          async function request(path, token) {
            const response = await fetch(`${apiBase}${path}`, {
              headers: token ? { authorization: `Bearer ${token}` } : {},
              signal: AbortSignal.timeout(30_000),
            });
            const body = await response.json();
            const data = body?.data ?? body;
            assert(response.ok, `${path} returned HTTP ${response.status}`);
            return data;
          }

          async function cleanupUser(userId) {
            const grants = await prisma.creditGrant.findMany({ where: { userId }, select: { id: true } });
            const grantIds = grants.map(item => item.id);
            const logs = await prisma.tokenUsageLog.findMany({ where: { userId }, select: { id: true } });
            const logIds = logs.map(item => item.id);
            if (logIds.length) await prisma.providerBillSample.deleteMany({ where: { usageLogId: { in: logIds } } });
            if (grantIds.length) await prisma.creditGrantEvent.deleteMany({ where: { grantId: { in: grantIds } } });
            await prisma.tokenUsageLog.deleteMany({ where: { userId } });
            await prisma.creditReservation.deleteMany({ where: { userId } });
            await prisma.creditGrant.deleteMany({ where: { userId } });
            await prisma.dailyTokenUsage.deleteMany({ where: { userId } });
            await prisma.aiGeneration.updateMany({ where: { userId }, data: { relatedId: null } });
            await prisma.aiGeneration.deleteMany({ where: { userId } });
            await prisma.aiConversation.deleteMany({ where: { userId } });
            await prisma.businessProfile.deleteMany({ where: { userId } });
            await prisma.feedback.deleteMany({ where: { userId } });
            await prisma.activationCode.deleteMany({ where: { userId } });
            await prisma.transaction.deleteMany({ where: { userId } });
            await prisma.tokenPack.deleteMany({ where: { userId } });
            await prisma.user.deleteMany({ where: { id: userId } });
          }

          (async () => {
            const health = await request('/health');
            assert(health.status === 'ok' && health.release === process.env.EXPECTED_RELEASE, `unexpected active release ${health.release}`);

            const stale = await prisma.user.findMany({
              where: { phone: { startsWith: prefix } },
              select: { id: true },
            });
            for (const item of stale) await cleanupUser(item.id);

            const now = new Date();
            const user = await prisma.user.create({
              data: {
                phone: process.env.E2E_UAT_PHONE,
                email: `${process.env.E2E_UAT_PHONE}@test.local`,
                passwordHash: 'disabled-production-points-calendar-ledger-uat',
                name: '生产日历流水 UAT',
                role: 'TERMINAL_USER',
                isActivated: true,
              },
            });
            const userToken = tokenFor(user);
            await prisma.activationCode.create({
              data: {
                code: `POINTS-UAT-${process.env.UAT_RUN_ID}`,
                type: 'TERMINAL',
                userId: user.id,
                status: 'USED',
                activatedAt: now,
                expiresAt: new Date(now.getTime() + 24 * 60 * 60 * 1000),
              },
            });

            const spendOperations = ['copywriting', 'chat', 'poster', 'personal_image', 'title_suggestion', 'copywriting', 'chat', 'poster', 'personal_image', 'title_suggestion', 'copywriting', 'chat'];
            await prisma.tokenUsageLog.createMany({
              data: spendOperations.map((operation, index) => ({
                userId: user.id,
                tokensUsed: 10 + index,
                operation,
                referenceId: `${process.env.UAT_RUN_ID}:spend:${index}`,
                createdAt: new Date(now.getTime() - (index + 4) * 1000),
              })),
            });
            await prisma.creditReservation.createMany({
              data: [
                {
                  userId: user.id,
                  referenceId: `${process.env.UAT_RUN_ID}:reserved`,
                  operation: 'video',
                  amount: 75,
                  status: 'RESERVED',
                  createdAt: new Date(now.getTime() - 1000),
                },
                {
                  userId: user.id,
                  referenceId: `${process.env.UAT_RUN_ID}:released`,
                  operation: 'personal_image',
                  amount: 40,
                  status: 'RELEASED',
                  createdAt: new Date(now.getTime() - 3000),
                  releasedAt: new Date(now.getTime() - 2000),
                },
              ],
            });

            const initial = await request('/token-packs/daily-claim', userToken);
            const calendar = await request('/token-packs/daily-calendar', userToken);
            const balance = await request('/token-packs/balance', userToken);
            assert(initial.timezone === 'Asia/Shanghai', `unexpected timezone ${initial.timezone}`);
            assert(initial.canClaim && !initial.claimed, `isolated user is not claimable: ${JSON.stringify(initial)}`);
            assert(calendar.businessDate === initial.businessDate, 'calendar/status business date mismatch');
            assert(calendar.days.some(day => day.isToday && day.state === 'TODAY_CLAIMABLE'), 'today is not claimable in calendar');
            assert(calendar.days.every(day => !day.grant), 'fresh UAT calendar contains fabricated grant history');
            assert(balance.remaining === 0, `fresh UAT balance is ${balance.remaining}, expected 0`);

            console.log(JSON.stringify({
              credentials: { userId: user.id, userToken },
              report: {
                release: process.env.EXPECTED_RELEASE,
                businessDate: initial.businessDate,
                timezone: initial.timezone,
                configuredDailyAmount: initial.amount,
                seededSpendRows: spendOperations.length,
                seededReservationRows: 2,
                initialBalance: balance.remaining,
                fabricatedCalendarGrants: 0,
              },
            }));
          })().finally(() => prisma.$disconnect());
          NODE
          REMOTE
          )

          E2E_USER_ID=$(UAT_JSON="$uat_json" node -e 'process.stdout.write(JSON.parse(process.env.UAT_JSON).credentials.userId)')
          E2E_USER_TOKEN=$(UAT_JSON="$uat_json" node -e 'process.stdout.write(JSON.parse(process.env.UAT_JSON).credentials.userToken)')
          E2E_BUSINESS_DATE=$(UAT_JSON="$uat_json" node -e 'process.stdout.write(JSON.parse(process.env.UAT_JSON).report.businessDate)')
          E2E_DAILY_AMOUNT=$(UAT_JSON="$uat_json" node -e 'process.stdout.write(String(JSON.parse(process.env.UAT_JSON).report.configuredDailyAmount))')
          echo "::add-mask::$E2E_USER_TOKEN"
          echo "E2E_USER_ID=$E2E_USER_ID" >> "$GITHUB_ENV"
          echo "E2E_USER_TOKEN=$E2E_USER_TOKEN" >> "$GITHUB_ENV"
          echo "E2E_BUSINESS_DATE=$E2E_BUSINESS_DATE" >> "$GITHUB_ENV"
          echo "E2E_DAILY_AMOUNT=$E2E_DAILY_AMOUNT" >> "$GITHUB_ENV"
          UAT_JSON="$uat_json" node -e '
            const fs = require("node:fs");
            const value = JSON.parse(process.env.UAT_JSON);
            fs.writeFileSync("uat-artifacts/server-setup.json", `${JSON.stringify(value.report, null, 2)}\n`);
          '

      - name: Run real desktop and mobile production UAT
        env:
          E2E_BASE_URL: https://zhiduoduoai.com
          EXPECTED_RELEASE: ${{ inputs.source_sha }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
          E2E_EVIDENCE_DIR: uat-artifacts
        run: node .github/e2e/production-points-calendar-ledger.cjs

      - name: Upload production UAT evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: points-calendar-ledger-production-uat-${{ inputs.source_sha }}
          path: uat-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Remove isolated production UAT user and ledger data
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -Eeuo pipefail
          if [ -z "${E2E_UAT_PHONE:-}" ]; then
            echo 'No UAT identity was allocated; cleanup is unnecessary.'
            exit 0
          fi
          sshpass -p "$SERVER_PASSWORD" ssh \
            -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" \
            "SOURCE_SHA='$SOURCE_SHA' E2E_USER_ID='${E2E_USER_ID:-}' E2E_UAT_PHONE='$E2E_UAT_PHONE' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          APP_ROOT=/opt/apps/zhiduoduo-platform
          TARGET_RELEASE="$APP_ROOT/releases/$SOURCE_SHA"
          test -d "$TARGET_RELEASE"
          cd "$TARGET_RELEASE"
          node --env-file="$APP_ROOT/shared/.env" <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          (async () => {
            const selectors = [{ phone: process.env.E2E_UAT_PHONE }];
            if (process.env.E2E_USER_ID) selectors.push({ id: process.env.E2E_USER_ID });
            const users = await prisma.user.findMany({ where: { OR: selectors }, select: { id: true } });
            for (const { id: userId } of users) {
              const grants = await prisma.creditGrant.findMany({ where: { userId }, select: { id: true } });
              const grantIds = grants.map(item => item.id);
              const logs = await prisma.tokenUsageLog.findMany({ where: { userId }, select: { id: true } });
              const logIds = logs.map(item => item.id);
              if (logIds.length) await prisma.providerBillSample.deleteMany({ where: { usageLogId: { in: logIds } } });
              if (grantIds.length) await prisma.creditGrantEvent.deleteMany({ where: { grantId: { in: grantIds } } });
              await prisma.tokenUsageLog.deleteMany({ where: { userId } });
              await prisma.creditReservation.deleteMany({ where: { userId } });
              await prisma.creditGrant.deleteMany({ where: { userId } });
              await prisma.dailyTokenUsage.deleteMany({ where: { userId } });
              await prisma.aiGeneration.updateMany({ where: { userId }, data: { relatedId: null } });
              await prisma.aiGeneration.deleteMany({ where: { userId } });
              await prisma.aiConversation.deleteMany({ where: { userId } });
              await prisma.businessProfile.deleteMany({ where: { userId } });
              await prisma.feedback.deleteMany({ where: { userId } });
              await prisma.activationCode.deleteMany({ where: { userId } });
              await prisma.transaction.deleteMany({ where: { userId } });
              await prisma.tokenPack.deleteMany({ where: { userId } });
              await prisma.user.deleteMany({ where: { id: userId } });
            }
            const remaining = await prisma.user.count({ where: { OR: selectors } });
            if (remaining !== 0) throw new Error(`UAT cleanup left ${remaining} users`);
            console.log(`production_points_calendar_ledger_uat_users_removed=${users.length}`);
          })().finally(() => prisma.$disconnect());
          NODE
          REMOTE

      - name: Record production points calendar and ledger acceptance
        run: |
          echo 'production_daily_calendar_visual_uat=passed'
          echo 'production_daily_claim_idempotency_uat=passed'
          echo 'production_balance_refresh_uat=passed'
          echo 'production_ledger_lazy_fold_uat=passed'
          echo 'production_mobile_accessibility_uat=passed'
          echo 'release_run_id=${{ inputs.release_run_id }}'
          echo 'source_sha=${{ inputs.source_sha }}'
