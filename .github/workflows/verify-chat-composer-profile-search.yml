name: Verify Zhiduoduo Chat Composer Profile Search Production
run-name: "verify chat-composer-profile-search ${{ inputs.source_sha }} [deploy-run-${{ inputs.release_run_id }}]"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Deployed immutable source SHA containing the UAT harness
        required: true
      release_run_id:
        description: Bound successful production deployment run ID
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: zhiduoduo-chat-composer-profile-search-production-uat
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Validate bound production release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/Infinity-light/ai-agent-distro-releases/actions/runs/$RELEASE_RUN_ID")
          RUN="$run" node -e '
            const run = JSON.parse(process.env.RUN);
            if (run.status !== "completed" || run.conclusion !== "success") throw new Error("Bound deployment is not successful");
            if (!String(run.display_title || run.name).includes(process.env.SOURCE_SHA)) throw new Error("Deployment is not bound to SOURCE_SHA");
          '

      - name: Checkout immutable source UAT harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Infinity-light/ai-agent-distro
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.GH_RELEASE_REPO_TOKEN }}
          path: source

      - name: Install real browser, audio fixture, and SSH runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-package-lock --no-save playwright@1.55.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng
          E2E_VOICE_FILE="$RUNNER_TEMP/zhiduoduo-chat-composer-voice.wav"
          espeak-ng -v en-us -s 135 -w "$E2E_VOICE_FILE" 'Zhiduoduo voice input acceptance test'
          test -s "$E2E_VOICE_FILE"
          ASKPASS_SCRIPT="$RUNNER_TEMP/zhiduoduo-chat-composer-uat-askpass"
          SSH_WRAPPER="$RUNNER_TEMP/zhiduoduo-chat-composer-uat-ssh"
          printf '%s\n' '#!/usr/bin/env sh' 'printf "%s\n" "$SERVER_PASSWORD"' > "$ASKPASS_SCRIPT"
          cat > "$SSH_WRAPPER" <<'SSH_WRAPPER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          exec timeout 900s setsid --wait ssh \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o NumberOfPasswordPrompts=1 \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            "$@"
          SSH_WRAPPER
          chmod 700 "$ASKPASS_SCRIPT" "$SSH_WRAPPER"
          {
            echo "SSH_ASKPASS=$ASKPASS_SCRIPT"
            echo "SSH_ASKPASS_REQUIRE=force"
            echo "DISPLAY=zhiduoduo-chat-composer-uat:0"
            echo "E2E_SSH_WRAPPER=$SSH_WRAPPER"
            echo "E2E_VOICE_FILE=$E2E_VOICE_FILE"
          } >> "$GITHUB_ENV"

      - name: Create two isolated production UAT accounts
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -Eeuo pipefail
          E2E_UAT_PREFIX="chat-composer-uat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "E2E_UAT_PREFIX=$E2E_UAT_PREFIX" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          if [ "$SERVER_PORT" = "22" ]; then KNOWN_HOST="$SERVER_HOST"; else KNOWN_HOST="[$SERVER_HOST]:$SERVER_PORT"; fi
          printf '%s %s\n' "$KNOWN_HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPozXPwB/2d1z/Rw8ysubUWKlOZJYqXUqmIP8BeCrq4j' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          uat_raw=$("$E2E_SSH_WRAPPER" \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "APP_ROOT=/opt/apps/zhiduoduo-platform; ACTIVE_RELEASE=\$(readlink -f \"/opt/apps/zhiduoduo-platform/current\"); test \"\$(basename \"\$ACTIVE_RELEASE\")\" = '$SOURCE_SHA'; cd \"\$ACTIVE_RELEASE\"; EXPECTED_RELEASE='$SOURCE_SHA' E2E_UAT_PREFIX='$E2E_UAT_PREFIX' node --env-file=\"\$APP_ROOT/shared/.env\" -" \
            < source/.github/e2e/production-chat-composer-profile-search-setup.cjs)
          uat_json=$(printf '%s\n' "$uat_raw" | tail -n 1)
          E2E_PROFILE_USER_ID=$(UAT_JSON="$uat_json" node -e 'process.stdout.write(JSON.parse(process.env.UAT_JSON).profileUserId)')
          E2E_PROFILE_TOKEN=$(UAT_JSON="$uat_json" node -e 'process.stdout.write(JSON.parse(process.env.UAT_JSON).profileToken)')
          E2E_BLANK_USER_ID=$(UAT_JSON="$uat_json" node -e 'process.stdout.write(JSON.parse(process.env.UAT_JSON).blankUserId)')
          E2E_BLANK_TOKEN=$(UAT_JSON="$uat_json" node -e 'process.stdout.write(JSON.parse(process.env.UAT_JSON).blankToken)')
          E2E_MARKERS_JSON=$(UAT_JSON="$uat_json" node -e 'process.stdout.write(JSON.stringify(JSON.parse(process.env.UAT_JSON).markers))')
          for value in "$E2E_PROFILE_USER_ID" "$E2E_PROFILE_TOKEN" "$E2E_BLANK_USER_ID" "$E2E_BLANK_TOKEN"; do echo "::add-mask::$value"; done
          {
            echo "E2E_PROFILE_USER_ID=$E2E_PROFILE_USER_ID"
            echo "E2E_PROFILE_TOKEN=$E2E_PROFILE_TOKEN"
            echo "E2E_BLANK_USER_ID=$E2E_BLANK_USER_ID"
            echo "E2E_BLANK_TOKEN=$E2E_BLANK_TOKEN"
            echo "E2E_MARKERS_JSON=$E2E_MARKERS_JSON"
          } >> "$GITHUB_ENV"

      - name: Run real desktop and 390x844 mobile composer UAT
        env:
          E2E_BASE_URL: https://zhiduoduoai.com
          EXPECTED_RELEASE: ${{ inputs.source_sha }}
          E2E_EVIDENCE_DIR: uat-artifacts
          NODE_PATH: ${{ github.workspace }}/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: node source/.github/e2e/production-chat-composer-profile-search.cjs

      - name: Collect profile, request, attachment, search, and action ledger evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -Eeuo pipefail
          mkdir -p uat-artifacts
          output=$("$E2E_SSH_WRAPPER" \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "APP_ROOT=/opt/apps/zhiduoduo-platform; ACTIVE_RELEASE=\$(readlink -f \"/opt/apps/zhiduoduo-platform/current\"); test \"\$(basename \"\$ACTIVE_RELEASE\")\" = '$SOURCE_SHA'; cd \"\$ACTIVE_RELEASE\"; EXPECTED_RELEASE='$SOURCE_SHA' E2E_UAT_PREFIX='$E2E_UAT_PREFIX' E2E_PROFILE_USER_ID='$E2E_PROFILE_USER_ID' E2E_BLANK_USER_ID='$E2E_BLANK_USER_ID' E2E_MARKERS_JSON='$E2E_MARKERS_JSON' E2E_CONVERSATION_IDS_JSON='$E2E_CONVERSATION_IDS_JSON' E2E_REQUEST_KEYS_JSON='$E2E_REQUEST_KEYS_JSON' E2E_UPLOAD_URLS_JSON='$E2E_UPLOAD_URLS_JSON' E2E_OLD_CONVERSATION_ID='$E2E_OLD_CONVERSATION_ID' E2E_NEW_CONVERSATION_ID='$E2E_NEW_CONVERSATION_ID' E2E_BLANK_CONVERSATION_ID='$E2E_BLANK_CONVERSATION_ID' E2E_DESKTOP_FILE_CONVERSATION_ID='$E2E_DESKTOP_FILE_CONVERSATION_ID' E2E_MOBILE_FILE_CONVERSATION_ID='$E2E_MOBILE_FILE_CONVERSATION_ID' E2E_DESKTOP_SEARCH_CONVERSATION_ID='$E2E_DESKTOP_SEARCH_CONVERSATION_ID' E2E_MOBILE_SEARCH_CONVERSATION_ID='$E2E_MOBILE_SEARCH_CONVERSATION_ID' E2E_MOBILE_SEARCH_OFF_CONVERSATION_ID='$E2E_MOBILE_SEARCH_OFF_CONVERSATION_ID' E2E_CHOICE_ACTION_ID='$E2E_CHOICE_ACTION_ID' E2E_DESKTOP_STOP_REQUEST_KEY='$E2E_DESKTOP_STOP_REQUEST_KEY' E2E_MOBILE_STOP_REQUEST_KEY='$E2E_MOBILE_STOP_REQUEST_KEY' node --env-file=\"\$APP_ROOT/shared/.env\" -" \
            < source/.github/e2e/production-chat-composer-profile-search-ledger.cjs)
          ledger=$(printf '%s\n' "$output" | tail -n 1)
          printf '%s\n' "$ledger" | tee uat-artifacts/server-ledger.json
          LEDGER_JSON="$ledger" node -e '
            const ledger = JSON.parse(process.env.LEDGER_JSON);
            if (!ledger.acceptance?.passed) throw new Error("Server ledger acceptance failed");
          '

      - name: Remove isolated accounts, rows, and uploaded objects
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -Eeuo pipefail
          mkdir -p uat-artifacts
          if [ -z "${E2E_UAT_PREFIX:-}" ]; then
            printf '{"cleanupComplete":false,"reason":"no scoped UAT prefix allocated"}\n' | tee uat-artifacts/cleanup-evidence.json
            exit 0
          fi
          upload_urls=${E2E_UPLOAD_URLS_JSON:-[]}
          output=$("$E2E_SSH_WRAPPER" \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "APP_ROOT=/opt/apps/zhiduoduo-platform; ACTIVE_RELEASE=\$(readlink -f \"/opt/apps/zhiduoduo-platform/current\"); test \"\$(basename \"\$ACTIVE_RELEASE\")\" = '$SOURCE_SHA'; cd \"\$ACTIVE_RELEASE\"; E2E_UAT_PREFIX='$E2E_UAT_PREFIX' E2E_UPLOAD_URLS_JSON='$upload_urls' node --env-file=\"\$APP_ROOT/shared/.env\" -" \
            < source/.github/e2e/production-chat-composer-profile-search-cleanup.cjs)
          cleanup=$(printf '%s\n' "$output" | tail -n 1)
          printf '%s\n' "$cleanup" | tee uat-artifacts/cleanup-evidence.json
          CLEANUP_JSON="$cleanup" node -e '
            const cleanup = JSON.parse(process.env.CLEANUP_JSON);
            if (!cleanup.cleanupComplete || Object.values(cleanup.remaining || {}).some(Number)) throw new Error("Scoped cleanup failed");
          '

      - name: Redact browser traces and assert no account credential remains
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p uat-artifacts
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import zipfile

          root = pathlib.Path('uat-artifacts')
          values = [os.environ.get(name, '') for name in (
              'E2E_PROFILE_TOKEN', 'E2E_BLANK_TOKEN', 'E2E_PROFILE_USER_ID', 'E2E_BLANK_USER_ID'
          )]
          needles = [value.encode() for value in values if len(value) >= 8]
          replacement = b'[REDACTED-UAT-CREDENTIAL]'
          jwt_pattern = re.compile(rb'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}')
          account_pattern = re.compile(rb'chat-composer-uat-[0-9-]+-[ab](?:@test\.local)?')

          def redact(data):
              for needle in needles:
                  data = data.replace(needle, replacement)
              data = jwt_pattern.sub(replacement, data)
              return account_pattern.sub(b'[REDACTED-UAT-ACCOUNT]', data)

          for archive in root.glob('*-trace.zip'):
              temporary = archive.with_suffix('.sanitized.zip')
              with zipfile.ZipFile(archive, 'r') as source, zipfile.ZipFile(temporary, 'w') as target:
                  for info in source.infolist():
                      target.writestr(info, redact(source.read(info.filename)))
              temporary.replace(archive)

          for item in root.iterdir():
              if item.is_file() and item.suffix != '.zip':
                  item.write_bytes(redact(item.read_bytes()))

          for item in root.iterdir():
              if not item.is_file():
                  continue
              if item.suffix == '.zip':
                  with zipfile.ZipFile(item, 'r') as source:
                      blobs = [source.read(name) for name in source.namelist()]
              else:
                  blobs = [item.read_bytes()]
              if any(needle in blob for needle in needles for blob in blobs):
                  raise SystemExit(f'credential remains in {item.name}')
              if any(jwt_pattern.search(blob) or account_pattern.search(blob) for blob in blobs):
                  raise SystemExit(f'rotated credential or account identifier remains in {item.name}')
          print(f'sanitized_trace_count={len(list(root.glob("*-trace.zip")))}')
          PY

      - name: Upload production UAT evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-composer-profile-search-production-uat-${{ inputs.source_sha }}
          path: uat-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Record production acceptance
        if: success()
        run: |
          echo 'production_chat_composer_profile_search_uat=passed'
          echo 'release_run_id=${{ inputs.release_run_id }}'
          echo 'source_sha=${{ inputs.source_sha }}'
          echo 'verification_url=https://zhiduoduoai.com/chat'
