name: Verify Zhiduoduo Context Isolation and Choice Production
run-name: "verify context-choice ${{ inputs.phase }} ${{ inputs.source_sha }} [deploy-run-${{ inputs.release_run_id }}]"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Deployed immutable source SHA
        required: true
      release_run_id:
        description: Bound successful production deployment run ID
        required: true
      phase:
        description: Evidence phase
        required: true
        type: choice
        options:
          - baseline
          - production
      expect_fixed:
        description: Enforce the post-fix contract
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zhiduoduo-context-choice-production-uat
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate bound release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/Infinity-light/ai-agent-distro-releases/actions/runs/$RELEASE_RUN_ID")
          RUN="$run" node -e '
            const run = JSON.parse(process.env.RUN);
            if (run.status !== "completed" || run.conclusion !== "success") throw new Error("Bound deployment is not successful");
            if (!String(run.display_title || run.name).includes(process.env.SOURCE_SHA)) throw new Error("Deployment is not bound to SOURCE_SHA");
          '

      - name: Checkout immutable production UAT harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Infinity-light/ai-agent-distro
          ref: 1b3c4f9c88590c50d719410498fbfefb57bc0a07
          token: ${{ secrets.GH_RELEASE_REPO_TOKEN }}
          path: source

      - name: Install production browser acceptance runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p runtime uat-artifacts
          npm install --prefix runtime --no-package-lock --no-save playwright@1.55.0
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" ./runtime/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Create isolated account and effective-context probe
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -Eeuo pipefail
          E2E_UAT_PREFIX="context-uat-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "E2E_UAT_PREFIX=$E2E_UAT_PREFIX" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          if [ "$SERVER_PORT" = "22" ]; then KNOWN_HOST="$SERVER_HOST"; else KNOWN_HOST="[$SERVER_HOST]:$SERVER_PORT"; fi
          printf '%s %s\n' "$KNOWN_HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPozXPwB/2d1z/Rw8ysubUWKlOZJYqXUqmIP8BeCrq4j' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          uat_raw=$(sshpass -p "$SERVER_PASSWORD" ssh \
            -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" \
            "EXPECTED_RELEASE='$SOURCE_SHA' E2E_UAT_PREFIX='$E2E_UAT_PREFIX' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          APP_ROOT=/opt/apps/zhiduoduo-platform
          ACTIVE_RELEASE=$(readlink -f "$APP_ROOT/current")
          test "$(basename "$ACTIVE_RELEASE")" = "$EXPECTED_RELEASE"
          cd "$ACTIVE_RELEASE"
          node --env-file="$APP_ROOT/shared/.env" <<'NODE'
          const fs = require('node:fs');
          const { PrismaClient } = require('@prisma/client');
          const jwt = require('jsonwebtoken');
          const prisma = new PrismaClient();
          const scopedPrefix = 'context-uat-';

          async function removeScopedUsers() {
            const users = await prisma.user.findMany({
              where: { phone: { startsWith: scopedPrefix } },
              select: { id: true, phone: true },
            });
            if (users.length > 20) throw new Error('Refusing to remove more than 20 scoped context UAT users');
            if (users.some((user) => !user.phone.startsWith(scopedPrefix))) throw new Error('Context UAT cleanup escaped its prefix');
            const userIds = users.map((user) => user.id);
            if (!userIds.length) return;
            await prisma.$transaction([
              prisma.businessProfile.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.creditReservation.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.tokenUsageLog.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.dailyTokenUsage.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.aiChatAction.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.aiChatRequest.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.aiConversation.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.aiGeneration.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.tokenPack.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.feedback.deleteMany({ where: { userId: { in: userIds } } }),
              prisma.user.deleteMany({ where: { id: { in: userIds }, phone: { startsWith: scopedPrefix } } }),
            ]);
          }

          (async () => {
            await removeScopedUsers();
            const suffix = `${process.env.E2E_UAT_PREFIX}-${Date.now()}`;
            const aiProfileData = {
              portraitUrl: 'https://example.invalid/UAT-LEGACY-PORTRAIT.png',
              portraitNote: 'UAT-LEGACY-VIDEO-PORTRAIT',
            };
            const user = await prisma.user.create({
              data: {
                phone: suffix,
                email: `${suffix}@test.local`,
                passwordHash: 'disabled-production-context-choice-uat',
                name: '上下文隔离生产验收',
                role: 'PLATFORM_ADMIN',
                isActivated: true,
                aiPersona: 'PRODUCT_OWNER',
                aiOnboardingDone: true,
                aiProfileData,
                tokenPacks: {
                  create: {
                    name: '生产 UAT 临时积分',
                    totalTokens: 100000,
                    price: 0,
                    expiresAt: new Date(Date.now() + 60 * 60 * 1000),
                  },
                },
              },
            });
            const profile = await prisma.businessProfile.create({
              data: {
                userId: user.id,
                identity: 'UAT-LEGACY-DINING-OWNER',
                industry: '餐饮',
                productType: '水煮鱼/酸菜鱼',
                productPrice: '60-80元',
                targetAudience: '周边上班族',
                currentScale: '月营收约8万',
                channelPreference: '抖音/小红书',
                persona: 'PRODUCT_OWNER',
                profileComplete: true,
              },
            });
            await prisma.aiConversation.create({
              data: {
                userId: user.id,
                title: '不得跨会话的合成历史',
                messages: {
                  create: [
                    { role: 'user', content: 'ORION-CONTEXT-7319 只属于这个旧会话。' },
                    { role: 'assistant', content: '已在这个旧会话中收到合成代号。' },
                  ],
                },
              },
            });

            const promptPath = './dist/apps/api/apps/api/src/ai/prompt-builder.js';
            const routePath = './dist/apps/api/apps/api/src/ai/chat-context-routing.js';
            const servicePath = './dist/apps/api/apps/api/src/ai/ai-chat.service.js';
            const { buildSystemPrompt } = require(promptPath);
            const serviceSource = fs.readFileSync(servicePath, 'utf8');
            const roleWideVideoRoute = /videoAdmin\s*=\s*user\.role\s*===/.test(serviceSource);
            const routing = fs.existsSync(routePath) ? require(routePath) : null;
            const videoRouteActive = routing
              ? routing.shouldEnableVideoDirector({ currentMessage: '请直接解释复利公式。', conversationMessages: [] })
              : roleWideVideoRoute;
            const effectivePrompt = buildSystemPrompt(profile, aiProfileData, { videoAdmin: videoRouteActive });
            const probe = {
              release: process.env.EXPECTED_RELEASE,
              roleWideVideoRoute,
              videoRouteActive,
              containsBusinessMarker: effectivePrompt.includes('UAT-LEGACY-DINING-OWNER') || effectivePrompt.includes('水煮鱼'),
              containsPortraitMarker: effectivePrompt.includes('UAT-LEGACY-VIDEO-PORTRAIT'),
              containsSpecificChoiceExample: effectivePrompt.includes('老板出镜') && effectivePrompt.includes('产品特写') && effectivePrompt.includes('老板 IP'),
              containsVideoSkill: effectivePrompt.includes('视频导演技能 V3'),
              containsDirectAnswerPolicy: effectivePrompt.includes('首要职责是直接解决用户当前明确提出的问题'),
            };
            const token = jwt.sign(
              { sub: user.id, phone: user.phone, role: user.role, sessionVersion: user.sessionVersion },
              process.env.JWT_SECRET,
              { expiresIn: '50m' },
            );
            console.log(JSON.stringify({ userId: user.id, token, probe }));
          })().finally(() => prisma.$disconnect());
          NODE
          REMOTE
          )
          uat_json=$(printf '%s\n' "$uat_raw" | tail -n 1)
          E2E_USER_ID=$(UAT_JSON="$uat_json" node -e 'process.stdout.write(JSON.parse(process.env.UAT_JSON).userId)')
          E2E_TOKEN=$(UAT_JSON="$uat_json" node -e 'process.stdout.write(JSON.parse(process.env.UAT_JSON).token)')
          echo "::add-mask::$E2E_TOKEN"
          echo "E2E_USER_ID=$E2E_USER_ID" >> "$GITHUB_ENV"
          echo "E2E_TOKEN=$E2E_TOKEN" >> "$GITHUB_ENV"
          UAT_JSON="$uat_json" node -e '
            const fs = require("node:fs");
            fs.writeFileSync("uat-artifacts/effective-context-probe.json", JSON.stringify(JSON.parse(process.env.UAT_JSON).probe, null, 2) + "\n");
          '

      - name: Validate effective-context boundary
        shell: bash
        env:
          EXPECT_FIXED: ${{ inputs.expect_fixed }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const probe = require('./uat-artifacts/effective-context-probe.json');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const fixed = process.env.EXPECT_FIXED === 'true';
          if (fixed) {
            assert(!probe.roleWideVideoRoute, 'video capability is still routed by role alone');
            assert(!probe.videoRouteActive, 'unrelated request still activates the video route');
            assert(!probe.containsBusinessMarker, 'saved business values still enter the unrelated prompt');
            assert(!probe.containsPortraitMarker, 'saved portrait metadata still enters the unrelated prompt');
            assert(!probe.containsSpecificChoiceExample, 'specific dining/video choice example remains');
            assert(!probe.containsVideoSkill, 'unrelated request still receives the video skill');
            assert(probe.containsDirectAnswerPolicy, 'direct-answer policy is absent');
          } else {
            assert(probe.roleWideVideoRoute && probe.videoRouteActive, 'baseline did not reproduce role-wide video routing');
            assert(probe.containsBusinessMarker, 'baseline did not reproduce business-profile injection');
            assert(probe.containsPortraitMarker, 'baseline did not reproduce portrait metadata injection');
            assert(probe.containsSpecificChoiceExample, 'baseline did not reproduce the specific choice example');
            assert(probe.containsVideoSkill, 'baseline did not reproduce video-skill injection');
          }
          console.log(JSON.stringify({ effectiveContextContract: fixed ? 'fixed' : 'baseline-reproduced', probe }));
          NODE

      - name: Run real production consumer UI UAT
        env:
          E2E_BASE_URL: https://zhiduoduoai.com
          EXPECTED_RELEASE: ${{ inputs.source_sha }}
          EXPECT_FIXED: ${{ inputs.expect_fixed }}
          E2E_PHASE: ${{ inputs.phase }}
          E2E_EVIDENCE_DIR: uat-artifacts
          NODE_PATH: ${{ github.workspace }}/runtime/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: node source/.github/e2e/production-context-choice.cjs

      - name: Remove isolated UAT accounts
        if: always()
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -Eeuo pipefail
          mkdir -p uat-artifacts
          if [ -z "${E2E_UAT_PREFIX:-}" ]; then
            printf '{"cleanup":"skipped","reason":"no scoped prefix allocated"}\n' > uat-artifacts/cleanup.json
            exit 0
          fi
          cleanup_raw=$(sshpass -p "$SERVER_PASSWORD" ssh \
            -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" \
            "E2E_UAT_PREFIX='$E2E_UAT_PREFIX' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          APP_ROOT=/opt/apps/zhiduoduo-platform
          ACTIVE_RELEASE=$(readlink -f "$APP_ROOT/current")
          cd "$ACTIVE_RELEASE"
          node --env-file="$APP_ROOT/shared/.env" <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          const scopedPrefix = 'context-uat-';
          (async () => {
            const users = await prisma.user.findMany({
              where: { phone: { startsWith: scopedPrefix } },
              select: { id: true, phone: true },
            });
            if (users.length > 20) throw new Error('Refusing to remove more than 20 scoped context UAT users');
            if (users.some((user) => !user.phone.startsWith(scopedPrefix))) throw new Error('Context UAT cleanup escaped its prefix');
            const userIds = users.map((user) => user.id);
            if (userIds.length) {
              await prisma.$transaction([
                prisma.businessProfile.deleteMany({ where: { userId: { in: userIds } } }),
                prisma.creditReservation.deleteMany({ where: { userId: { in: userIds } } }),
                prisma.tokenUsageLog.deleteMany({ where: { userId: { in: userIds } } }),
                prisma.dailyTokenUsage.deleteMany({ where: { userId: { in: userIds } } }),
                prisma.aiChatAction.deleteMany({ where: { userId: { in: userIds } } }),
                prisma.aiChatRequest.deleteMany({ where: { userId: { in: userIds } } }),
                prisma.aiConversation.deleteMany({ where: { userId: { in: userIds } } }),
                prisma.aiGeneration.deleteMany({ where: { userId: { in: userIds } } }),
                prisma.tokenPack.deleteMany({ where: { userId: { in: userIds } } }),
                prisma.feedback.deleteMany({ where: { userId: { in: userIds } } }),
                prisma.user.deleteMany({ where: { id: { in: userIds }, phone: { startsWith: scopedPrefix } } }),
              ]);
            }
            console.log(JSON.stringify({ cleanupComplete: true, removedScopedAccounts: users.length }));
          })().finally(() => prisma.$disconnect());
          NODE
          REMOTE
          )
          printf '%s\n' "$cleanup_raw" | tail -n 1 | tee uat-artifacts/cleanup.json

      - name: Upload production UAT evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: context-choice-${{ inputs.phase }}-${{ inputs.source_sha }}
          path: uat-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Record production acceptance
        if: success()
        run: |
          echo 'production_context_choice_uat=passed'
          echo 'phase=${{ inputs.phase }}'
          echo 'release_run_id=${{ inputs.release_run_id }}'
          echo 'source_sha=${{ inputs.source_sha }}'
          echo 'verification_url=https://zhiduoduoai.com/chat'
