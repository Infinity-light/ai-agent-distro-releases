name: Audit and Clean Zhiduoduo Email UAT
run-name: email UAT audit and cleanup for the fixed synthetic account

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Encode the immutable one-time audit script
        id: audit-script
        shell: bash
        run: echo "payload=$(base64 -w0 .github/scripts/email-uat-audit-cleanup.cjs)" >> "$GITHUB_OUTPUT"

      - name: Audit and remove the exact synthetic account
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          UAT_AUDIT_SCRIPT_B64: ${{ steps.audit-script.outputs.payload }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          fingerprint: SHA256:gy2tS+Z/+PjfElXqJ4oRRuVSpIeo8CfWyKOcXqB3FSI
          command_timeout: 8m
          envs: UAT_AUDIT_SCRIPT_B64
          script: |
            set -Eeuo pipefail
            APP_ROOT=/opt/apps/zhiduoduo-platform
            RELEASE_DIR=$(readlink -f "$APP_ROOT/current")
            SHARED_ENV="$APP_ROOT/shared/.env"
            test -f "$RELEASE_DIR/package.json"
            test -f "$SHARED_ENV"

            UAT_SCRIPT=$(mktemp /tmp/zhiduoduo-email-uat-cleanup.XXXXXX.cjs)
            trap 'rm -f "$UAT_SCRIPT"' EXIT
            printf '%s' "$UAT_AUDIT_SCRIPT_B64" | base64 -d > "$UAT_SCRIPT"
            chmod 600 "$UAT_SCRIPT"
            cd "$RELEASE_DIR"
            node --env-file="$SHARED_ENV" "$UAT_SCRIPT"
